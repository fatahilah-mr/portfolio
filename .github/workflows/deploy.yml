name: 🚀 Deploy to cPanel (FTP)

on:
  push:
    branches:
      - public
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repo
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # 4. Hapus hasil build lama & Build proyek Astro
      - name: 🧹 Clean Old Build & 🏗️ Build Astro Project
        run: |
          rm -rf dist
          npm run build
        env:
          NODE_ENV: production

      # 5. Deploy via FTP ke cPanel
      - name: 🚀 Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Kredensial FTP — simpan di GitHub Secrets!
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21

          # Folder lokal yang diupload (hasil build Astro)
          local-dir: ./dist/

          # Folder tujuan di server cPanel
          server-dir: ./website/test-portfolio.fatah.web.id/

          # Opsi pembersihan & enkripsi
          protocol: ftps                   # Gunakan FTPS (Explicit TLS)
          dangerous-clean-slate: true      # Hapus seluruh file/folder lama di cPanel sebelum upload baru
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
